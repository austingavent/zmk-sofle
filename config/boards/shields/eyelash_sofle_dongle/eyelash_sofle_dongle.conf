# Dongle configuration
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB_LOGGING=n

# Disable features not present on dongle hardware
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_DISPLAY=n

# Keep encoder support for receiving events from peripherals
# CONFIG_EC11=n  <- REMOVED: Dongle should receive encoder events
